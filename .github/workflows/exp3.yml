# Experiment 3 on GitHub's servers (no laptop needed).
# Start it from the Actions tab: "Experiment 3 (Nemotron, Architect baseline)" -> Run workflow.
# Needs one repository secret: NVIDIA_API_KEY (Settings -> Secrets and variables -> Actions).
# Each RealBench task runs in its own job; a final job merges the results and runs the registered analysis.
name: Experiment 3 (Nemotron, Architect baseline)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download RealBench once and keep the 9 projects
        run: |
          python3 -m venv /tmp/main && /tmp/main/bin/pip -q install gdown pyyaml
          /tmp/main/bin/gdown 1RB3jUmD-6JvqvE5M1E5w_xYaxz3PC_T3 -O /tmp/rb.zip
          /tmp/main/bin/python - <<'EOF'
          import zipfile, yaml, re
          tasks = yaml.safe_load(open("prereg/plan.yaml"))["experiment_3"]["tasks"]
          names = {t.split("/", 1)[1] for t in tasks}
          z = zipfile.ZipFile("/tmp/rb.zip")
          keep = [n for n in z.namelist() if not n.startswith("__MACOSX")
                  and re.search(r"projs_filtered_uml/level\d/[^/]+/([^/]+)/", n)
                  and re.search(r"projs_filtered_uml/level\d/[^/]+/([^/]+)/", n).group(1) in names]
          z.extractall("/tmp/subset", keep)
          print(len(keep), "files kept for", len(names), "projects")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: realbench-subset
          path: /tmp/subset
          retention-days: 1

  task:
    needs: data
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        task: [level1/salvozappa_gattino, level1/draeician_crules, level2/aliyun_alibabacloud-dms-mcp-server,
               level2/pab1it0_adx-mcp-server, level2/rileydakota_crx-analyzer, level2/antoine311200_torchcolor,
               level2/FreddyRodgers_emojichef, level3/Reconnaissance]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the run checks plan.yaml against the prereg-* tags
      - name: System packages
        run: sudo apt-get update -q && sudo apt-get install -y -q python3-venv python3-tk
      - name: Python packages
        run: |
          python3 -m venv /tmp/main && /tmp/main/bin/pip -q install numpy scipy networkx pandas matplotlib scikit-learn infomap pyyaml openai
          python3 -m venv /tmp/rbenv && /tmp/rbenv/bin/pip -q install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/rbenv/bin/pip -q install -r scripts/realbench_test_requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: realbench-subset
          path: /tmp/rb
      - name: RealBench data
        run: echo "DATA=$(find /tmp/rb -type d -name projs_filtered_uml | head -1)" >> "$GITHUB_ENV"
      - name: Scorer check (free) - the reference code must pass its tests here too
        run: |
          /tmp/main/bin/python scripts/run_realbench.py --block experiment_3 --data "$DATA" --task "${{ matrix.task }}" \
              --check --fresh-reference --python /tmp/rbenv/bin/python --results /tmp/refcheck || true
          /tmp/main/bin/python - <<'EOF'
          import json, sys
          t = "${{ matrix.task }}"
          here = json.load(open("/tmp/refcheck/reference.json"))[t]
          colab = json.load(open("results/experiment_2/reference.json"))[t]
          print("reference tests passed here:", here["passed"], "| in Colab (Experiment 2):", colab["passed"])
          if here["passed"] != colab["passed"]:
              sys.exit("Test environment differs from Experiment 2: stopping before any model call.")
          EOF
      - name: Check the 16,000-token output cap is accepted (one tiny call)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          /tmp/main/bin/python - <<'EOF'
          import os
          from openai import OpenAI
          c = OpenAI(base_url="https://integrate.api.nvidia.com/v1", api_key=os.environ["NVIDIA_API_KEY"])
          r = c.chat.completions.create(model="nvidia/nemotron-3-ultra-550b-a55b", max_tokens=16000, temperature=0,
                                        messages=[{"role": "user", "content": "Reply with the word ok."}])
          print("cap accepted; reply:", (r.choices[0].message.content or "")[:40])
          EOF
      - name: Run the task (model calls)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          /tmp/main/bin/python scripts/run_realbench.py --block experiment_3 --data "$DATA" --task "${{ matrix.task }}" \
              --python /tmp/rbenv/bin/python --cache cache
      - name: Name for the artifact
        if: always()
        run: |
          echo "ART=$(echo '${{ matrix.task }}' | tr '/' '_')" >> "$GITHUB_ENV"
          # one cache file per task, so merging the artifacts cannot overwrite replies
          for f in cache/nvidia__*.jsonl; do [ -f "$f" ] && mv "$f" "${f%.jsonl}__$(echo '${{ matrix.task }}' | tr '/' '_').jsonl"; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp3-${{ env.ART }}
          path: |
            results/experiment_3
            runs/experiment_3
            cache/nvidia__*
          if-no-files-found: warn

  analyse:
    needs: task
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: exp3-*
          path: /tmp/parts
      - name: Merge and analyse
        run: |
          python3 -m venv /tmp/main && /tmp/main/bin/pip -q install numpy scipy
          mkdir -p results/experiment_3 runs/experiment_3 cache
          for d in /tmp/parts/*; do
            cp -r "$d"/results/experiment_3/. results/experiment_3/ 2>/dev/null || true
            cp -r "$d"/runs/experiment_3/. runs/experiment_3/ 2>/dev/null || true
            cp "$d"/cache/nvidia__* cache/ 2>/dev/null || true
          done
          /tmp/main/bin/python scripts/analyse_exp2.py --results results/experiment_3 --conditions G2 G4 GC G6 G7 G8 | tee results/experiment_3/summary_print.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exp3_results
          path: |
            results/experiment_3
            runs/experiment_3
            cache/nvidia__*
