# Pre-registration for Experiment 1 (pilot). Freeze BEFORE the first API run:
#   1. check/edit the model line below
#   2. git add -A && git commit -m "pilot pre-registration" && git tag prereg-v1
# Nothing in this file may change after the first run. Changes after that are
# reported as deviations in the paper.

experiment: pilot-v1
amendments:
  - date: 2026-11-22
    tag: prereg-v1.1
    before_any_model_run: true
    change: "model anthropic/claude-sonnet-5-5 -> vercel/alibaba/qwen3-coder (no Anthropic key available; open-weight model aids reproducibility). Nothing else changed."
  - date: 2026-11-22
    tag: prereg-v1.2
    before_any_model_run: true
    change: "model alibaba/qwen3-coder -> alibaba/qwen3-coder-30b-a3b (the first ID was not offered by the gateway; the only call returned 404, so no model output existed). Nothing else changed."
  - date: 2026-11-22
    tag: prereg-v1.3
    before_any_model_run: true   # for the two added tasks; existing pilot runs are unchanged
    change: >
      Experiment 1b added after the Python pilot. Two fresh k*=1 projects whose scorer check is usable
      (geotext 9/9, particle-swarm-optimization 6/6, empty code 0) are added with the same model, prompts,
      settings and conditions. hone is excluded because empty code passes 12/12 (scorer rule). The
      hypotheses below were written before any model call on these tasks.
  - date: 2026-11-23
    tag: prereg-v1.4
    before_any_model_run: true   # for second_model; all earlier runs are unchanged
    change: >
      Second model registered after Experiment 1b, before any call to it: deepseek/deepseek-v4.1-flash-1017
      through OpenRouter (open weights, dated snapshot, a different model family from Qwen). It replicates the
      same four Python projects, five conditions, three runs, prompts, settings and analysis rules.
  - date: 2026-11-23
    tag: prereg-v1.5
    before_any_model_run: true   # for third_model; earlier runs are unchanged
    change: >
      Third model registered before any call to it: gemini-3.8-flash (Google Gemini API, OpenAI-compatible
      endpoint) with reasoning_effort low, as the stronger model meant to lift scores off the floor. Fallback
      fixed in advance: if gemini-3.8-flash is unavailable to this key (quota or access error) before any
      successful call, use gemini-2.5-flash with reasoning_effort none, and report the switch.
  - date: 2026-11-23
    tag: prereg-v1.6
    before_any_model_run: false  # second_model attempt 1 ran and is excluded as invalid
    change: >
      second_model attempt 1 is invalid: deepseek/deepseek-v4.1-flash-1017 spent the whole 8,000-token output
      budget on hidden reasoning in 37 of 45 calls and returned no code, so no condition could be scored.
      The model is re-run with hidden reasoning switched off (reasoning_enabled: false), everything else
      unchanged. Attempt 1 is kept in results/second_model_attempt1_invalid/ and in the cache.
  - date: 2026-11-23
    tag: prereg-v1.7
    before_any_model_run: true   # for experiment_2; no model has seen any RealBench task
    change: >
      Experiment 2 registered on RealBench (arXiv 2604.22659) before any model call on it. The 12 tasks were
      chosen by a fixed structural rule from the zero-call analysis (results/realbench_table.csv), without
      any agent output: criterion team size 2 to 6 and a partition different from both one-agent-per-class
      (GC) and Infomap (G6). These are the projects where the criterion makes a choice the baselines do not.
  - date: 2026-11-23
    tag: prereg-v1.8
    before_any_model_run: true   # still no model call on any RealBench task
    change: >
      The zero-call harness check found three faults in reading RealBench designs, fixed before any model
      call: (1) UML modules are named by file name only, so two files called server.py or __init__.py were
      merged into one unit; full paths now come from RealBench's own tree.txt; (2) files with no class and
      no function (package __init__.py with imports, constant-only files) had no owner, so no agent wrote
      them; every file now has a unit; (3) class names shared by two files are qualified by full path.
      The registered selection rule is re-applied unchanged to the corrected duty graphs: 17 projects
      qualify (10 of the 12 listed in v1.7 plus 7 new; AI-Games-Hex and eqld_nlsh no longer qualify). The
      task list below is the rule's output; the rule itself, hypotheses, model and analysis are unchanged.
      Merge v2 (source order, import-time dependency order, property getter+setter kept together) is used
      for every condition of Experiment 2; with the reference code split per team it reproduces the
      reference score for all 5 conditions on all usable tasks (scripts/run_realbench.py --provider fake).
  - date: 2026-11-23
    tag: prereg-v1.9
    before_any_model_run: false  # 9 Experiment 2 runs were made on OpenRouter before its credit ran out
    change: >
      Experiment 2 provider switch, same model. The OpenRouter credit ran out after 9 runs on two tasks
      (adx-mcp-server 7, gattino 2), so the experiment could not finish there. The same dated model,
      deepseek/deepseek-v4.1-flash-1017, is available on the Vercel AI Gateway (checked with one test call).
      All Experiment 2 runs, including those 9, are made on Vercel so that every task uses one provider;
      the 9 OpenRouter runs are kept in results/experiment_2_openrouter_partial/ and excluded from the
      analysis. Model, reasoning setting, temperature, caps, tasks, hypotheses and analysis are unchanged.
  - date: 2026-11-23
    tag: prereg-v1.10
    before_any_model_run: true   # no call with exp2b_model on any task
    change: >
      Experiment 2b registered: a stronger, open-weight model (NVIDIA Nemotron 3 Ultra, free endpoint on
      OpenRouter) on the 9 usable Experiment 2 tasks, to test whether the Experiment 2 ties were floor effects
      of the weaker model. To fit the free endpoint's daily request limit, only G2, G4 and G7 run, once each
      (run 0); at temperature 0 the three Experiment 2 runs were mostly identical. Registered after Experiment 2
      results were seen; it is a replication with a stronger model, not a new selection of tasks.
  - date: 2026-11-23
    tag: prereg-v1.11
    before_any_model_run: true   # only two one-line connectivity checks (add(a, b)) with this model; no task call
    change: >
      Experiment 2b provider switch, same model: NVIDIA Nemotron 3 Ultra is served directly by NVIDIA's API
      catalog (nvidia/nemotron-3-ultra-550b-a55b), without the OpenRouter free endpoint's limit of about
      50 requests a day. With that limit gone, Experiment 2b runs all five Experiment 2 conditions
      (G2, G4, GC, G6, G7), still once each (run 0). No reasoning parameter is sent; a check call returned
      plain code without hidden reasoning. Hypotheses: primary unchanged (G7 > G4); secondary G7 vs G2, GC
      and G6, Holm-corrected.
date_frozen: 2026-11-22            # fill in when you tag
question: >
  On the same model, prompts and token cap, does the criterion team (G7) pass
  more DevBench tests than a random team of the same group sizes (G4), and how
  does it compare with one agent per class (GC), an Infomap team (G6) and a
  single agent (G2)? On a project where the criterion says k*=1, is a single
  agent at least as good as split teams?

model:
  provider: vercel            # Vercel AI Gateway, key in AI_GATEWAY_API_KEY (never in files)
  name: alibaba/qwen3-coder-30b-a3b   # Qwen3-Coder-30B-A3B-Instruct: open weights, fixed release,
                                      # coding model without a "thinking" mode (low token use)
  temperature: 0.0
  max_tokens_per_call: 8000
token_cap_per_run: 200000
runs_per_condition: 3        # run_id 0, 1, 2
design: gold                 # pilot isolates the split; extracted designs come in the main study (H4)

criterion:
  weights: {intra: 1.0, strong: 0.5, weak: 0.25, sig: 0.5}
  lambda: 0.0
  random_seed: 20261121

conditions: [G2, G4, GC, G6, G7]
duplicate_teams: identical partitions send identical prompts and are answered from the cache

tasks:
  - {project: python/stocktrends, why: "k*=3; Infomap gives 4 agents (differs from G7)"}
  - {project: python/TextCNN,     why: "k*=5 (= one per class); Infomap gives 4"}
  - {project: python/lice,        why: "k*=1 with 5 classes: tests 'do not split'"}
  - {project: cpp/xlsx2csv,       why: "k*=3; G7 = Infomap; vs random and single (Docker)"}
  - {project: java/idcenter,      why: "k*=3; G7 = Infomap; vs random and single (Docker)"}
  - {project: python/geotext,     why: "Experiment 1b: k*=1 with 2 classes (fresh task)"}
  - {project: python/particle-swarm-optimization, why: "Experiment 1b: k*=1 with 2 classes (fresh task)"}

experiment_1b:
  question: "Where the criterion recommends one agent, is a single agent as correct as split teams at lower cost?"
  hypotheses:
    H3a_cost: "On every k*=1 task, mean tokens of G2 < mean tokens of G4 and of GC (exact permutation test over runs)."
    H3b_correctness: "On a majority of k*=1 tasks where some condition passes > 0 tests, mean tests passed of G2 >= max(G4, GC)."
  tasks_k1: [python/lice, python/geotext, python/particle-swarm-optimization]

scoring:
  metric: pass_rate = tests passed / tests passed by DevBench's own answer code
  usable_task: scripts/check_scorer.py reports usable = YES
  sandbox: Python in a fresh venv; C++/Java in the devbench:complete Docker image

go_no_go:                     # decided by scripts/analyse_pilot.py, not by hand
  go_if_all:
    - "On informative multi-agent tasks (k*>1 and some team passes >0 tests; at least 2 such tasks): mean pass rate G7 >= G4 on a majority, with G7 > G4 on at least one"
    - "On those tasks: mean tokens G7 <= 1.10 x G4"
    - "On lice (k*=1): mean pass rate G2 >= max(GC, G4), and some team passes >0 tests"
  interpretation:
    G7_vs_G6_tie: "if G7 and G6 are within 0.05 pass rate, the paper's claim rests on choosing k (including k=1)"
    no_go: "revise the method using pilot tasks only; never tune on main-study test tasks"

reported_metrics: [pass_rate, tokens, messages, message_tokens, traceability, stopped_by_budget]

second_model:
  provider: openrouter          # key in OPENROUTER_API_KEY (Colab Secrets only, never in files)
  name: deepseek/deepseek-v4.1-flash-1017   # open weights, dated snapshot (not a "latest" alias)
  reasoning_enabled: false      # attempt 1 spent the output budget on hidden reasoning (see amendments)
  why: "Replication with a second model family; answers 'does it hold beyond one model?'"
  tasks: [python/stocktrends, python/lice, python/geotext, python/particle-swarm-optimization]
  analysis: "Same go/no-go rules and H3a/H3b as the primary model, reported separately (results/second_model/)."

third_model:
  provider: gemini              # key in GEMINI_API_KEY (Colab Secrets only, never in files)
  name: gemini-3.8-flash        # stable name (no "preview" or "latest")
  reasoning_effort: low         # caps hidden thinking tokens; part of the cache key
  fallback: {name: gemini-2.5-flash, reasoning_effort: none}
  why: "Stronger model: tests whether conditions separate once scores leave the floor."
  tasks: [python/stocktrends, python/lice, python/geotext, python/particle-swarm-optimization]
  analysis: "Same go/no-go rules and H3a/H3b as the primary model, reported separately (results/third_model/)."

experiment_2:
  benchmark: "RealBench, projs_filtered_uml (61 Python projects); design files as distributed"
  question: "On real projects where the criterion's team differs from the baselines, does it pass more tests than a random team of the same sizes?"
  selection_rule: "full view, lambda 0: 2 <= k* <= 6, ARI(G7, GC) < 1 and ARI(G7, G6) < 1 (scripts/run_realbench_structural.py)"
  tasks: [level1/AasaiAlangaram__PySecOC, level1/tcsenpai__sigmon, level1/salvozappa_gattino,
          level1/tsensei_Semantic-Markdown-Parser, level1/draeician_crules,
          level2/aliyun_alibabacloud-dms-mcp-server, level2/pab1it0_adx-mcp-server, level2/rileydakota_crx-analyzer,
          level2/antoine311200_torchcolor, level2/FreddyRodgers_emojichef, level2/phihung_fh_utils,
          level3/Camera, level3/Reconnaissance, level3/symeval,
          level4/integral-business-intelligence_chroma-auditor, level4/Crypt-Guard_CryptGuard,
          level4/simons-freedom_X-monitor]
  agent_input: "README.md from proj_clean when RealBench ships one, the class diagram with its descriptions (uml_output/*_uml.json) and the file tree (uml_output/tree.txt), rendered by objectgraph/realbench_task.py; no tests, no source code"
  test_environment: "scripts/realbench_test_requirements.txt (+ torch from the host); usability is decided by scripts/run_realbench.py --check in the run sandbox before any model call"
  duty_graph: "docs/realbench_mapping.md (classes + module-function units, weak dependency/import edges, signature edges)"
  model: exp2_model               # deepseek/deepseek-v4.1-flash-1017 via Vercel (amendment v1.9)
  conditions: [G2, G4, GC, G6, G7]
  runs_per_condition: 3
  scoring:
    metric: "pass_rate = RealBench tests passed / tests passed by RealBench's own reference code"
    usable_task: "the reference code passes at least one test in our sandbox; unusable tasks are reported and not replaced"
  hypotheses:
    H1_primary: "Across usable tasks, per-task mean pass rate of G7 > G4 (one-sided Wilcoxon signed-rank, alpha 0.05; ties dropped)."
    H1_secondary: "G7 vs GC and G7 vs G6, two-sided Wilcoxon signed-rank, Holm-corrected; reported whatever the outcome."
    H2_cost: "Median over tasks of tokens(G7) / tokens(G4) <= 1.10."
  floor_rule: "If fewer than 4 usable tasks have any condition above 0 pass rate, H1 is reported as untestable at this model strength (not as support or rejection)."
  analysis: "Reported in results/experiment_2/; every task shown, including unusable and floor tasks."

exp2_model:
  provider: vercel              # key in AI_GATEWAY_API_KEY (Colab Secrets only, never in files)
  name: deepseek/deepseek-v4.1-flash-1017   # same dated model as second_model
  reasoning_enabled: false
  why: "Experiment 2 provider after the OpenRouter credit ran out (amendment v1.9)."

exp2b_model:
  provider: nvidia              # key in NVIDIA_API_KEY (Colab Secrets only, never in files)
  name: nvidia/nemotron-3-ultra-550b-a55b   # open weights; NVIDIA API catalog (amendment v1.11; v1.10 used the OpenRouter free endpoint)
  why: "Stronger open-weight model for Experiment 2b (amendments v1.10, v1.11)."

experiment_2b:
  benchmark: "RealBench; the 9 tasks that were usable in Experiment 2 (results/experiment_2/reference.json)"
  question: "With a stronger model, does the criterion's team pass more tests than a random team of the same sizes?"
  usable_from: experiment_2
  tasks: [level1/salvozappa_gattino, level1/draeician_crules, level2/aliyun_alibabacloud-dms-mcp-server,
          level2/pab1it0_adx-mcp-server, level2/rileydakota_crx-analyzer, level2/antoine311200_torchcolor,
          level2/FreddyRodgers_emojichef, level3/Camera, level3/Reconnaissance]
  agent_input: same as experiment_2
  duty_graph: same as experiment_2
  model: exp2b_model
  conditions: [G2, G4, GC, G6, G7]
  runs_per_condition: 1
  scoring: same as experiment_2
  hypotheses:
    H1_primary: "Per-task pass rate of G7 > G4 (one-sided Wilcoxon signed-rank over usable tasks, alpha 0.05; ties dropped)."
    H1_secondary: "G7 vs G2, GC and G6, two-sided Wilcoxon signed-rank, Holm-corrected; reported whatever the outcome."
    H2_cost: "Median over tasks of tokens(G7) / tokens(G4) <= 1.10."
  floor_rule: "If fewer than 4 tasks have any condition above 0 pass rate, H1 is reported as untestable at this model strength."
  analysis: "python scripts/analyse_exp2.py --results results/experiment_2b"
  provider_limits: "If the provider refuses calls (credit or limit), the run stops and continues later from the cache."
